name: gradle

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"
      java-distribution:
        type: string
        default: temurin
      task:
        type: string
        default: build
      publish:
        type: boolean
        default: false
      artifact-name:
        type: string
        default: ""
      artifact-path:
        type: string
        default: ""
    secrets:
      SNIFFA_MAVEN_USER:
        required: false
      SNIFFA_MAVEN_PASSWORD:
        required: false
      SNIFFA_DEPLOY_USER:
        required: false
      SNIFFA_DEPLOY_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        env:
          SNIFFA_MAVEN_USER: ${{ secrets.SNIFFA_MAVEN_USER }}
          SNIFFA_MAVEN_PASSWORD: ${{ secrets.SNIFFA_MAVEN_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ inputs.task }} --no-daemon

      - name: Upload jar
        if: inputs.artifact-path != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || github.event.repository.name }}
          path: ${{ inputs.artifact-path }}
          retention-days: 14

  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish to maven.sniffa.studio
        env:
          SNIFFA_DEPLOY_USER: ${{ secrets.SNIFFA_DEPLOY_USER }}
          SNIFFA_DEPLOY_PASSWORD: ${{ secrets.SNIFFA_DEPLOY_PASSWORD }}
          SNIFFA_MAVEN_USER: ${{ secrets.SNIFFA_MAVEN_USER }}
          SNIFFA_MAVEN_PASSWORD: ${{ secrets.SNIFFA_MAVEN_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew publish --no-daemon
