name: paper-plugin

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "25"
      jar:
        type: string
        default: "build/libs/*.jar"
      must-contain:
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 15
    secrets:
      SNIFFA_MAVEN_USER:
        required: false
      SNIFFA_MAVEN_PASSWORD:
        required: false
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      kept:
        value: ${{ jobs.build.outputs.kept }}

jobs:
  build:
    runs-on: [self-hosted, sniffa]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      kept: ${{ steps.keep.outputs.kept }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Version
        id: version
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
          SNIFFA_MAVEN_USER: ${{ secrets.SNIFFA_MAVEN_USER }}
          SNIFFA_MAVEN_PASSWORD: ${{ secrets.SNIFFA_MAVEN_PASSWORD }}
        run: |
          if [ -z "$SNIFFA_MAVEN_USER" ]; then unset SNIFFA_MAVEN_USER SNIFFA_MAVEN_PASSWORD; fi
          chmod +x gradlew
          if [ -n "$PR" ]; then
            channel="pr$PR"
          else
            channel=$(printf '%s' "${REF_NAME##*/}" | tr -c 'A-Za-z0-9' '-' | sed 's/-*$//')
          fi
          if grep -qs 'studio.sniffa.version' build.gradle.kts settings.gradle.kts; then
            version=$(./gradlew -q sniffaVersion --build-cache | tail -1)
            managed=true
          else
            base=$(grep -E '^version=' gradle.properties 2>/dev/null | cut -d= -f2 | sed 's/-SNAPSHOT$//')
            base=${base:-0.0.0}
            version="$base-$channel.${{ github.run_number }}+${GITHUB_SHA::7}"
            managed=false
          fi
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "managed=$managed"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SNIFFA_MAVEN_USER: ${{ secrets.SNIFFA_MAVEN_USER }}
          SNIFFA_MAVEN_PASSWORD: ${{ secrets.SNIFFA_MAVEN_PASSWORD }}
          MANAGED: ${{ steps.version.outputs.managed }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$SNIFFA_MAVEN_USER" ]; then unset SNIFFA_MAVEN_USER SNIFFA_MAVEN_PASSWORD; fi
          if [ "$MANAGED" = true ]; then
            ./gradlew build --build-cache
          else
            ./gradlew build --build-cache "-Pversion=$VERSION"
          fi

      - name: Find the jar
        id: jar
        run: |
          jar=""
          for candidate in ${{ inputs.jar }}; do
            case "$candidate" in *-sources.jar|*-javadoc.jar|*-plain.jar|*-dev.jar) continue ;; esac
            [ -f "$candidate" ] || continue
            if [ -z "$jar" ] || [ "$(stat -c %s "$candidate")" -gt "$(stat -c %s "$jar")" ]; then jar="$candidate"; fi
          done
          [ -n "$jar" ] || { echo "::error::No jar matches ${{ inputs.jar }}"; exit 1; }
          echo "path=$jar" >> "$GITHUB_OUTPUT"

      - name: Check the jar
        if: inputs.must-contain != ''
        env:
          JAR: ${{ steps.jar.outputs.path }}
          CLASS: ${{ inputs.must-contain }}
        run: |
          jar tf "$JAR" > "$RUNNER_TEMP/entries"
          grep -qxF "$CLASS" "$RUNNER_TEMP/entries" || { echo "::error::$CLASS is not in $(basename "$JAR")"; exit 1; }

      - name: Keep the jar
        id: keep
        if: github.event_name == 'push'
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          target="$HOME/sniffa-artifacts/${{ github.event.repository.name }}"
          [ "$BRANCH" = "$DEFAULT_BRANCH" ] || target="$target/$CHANNEL"
          mkdir -p "$target"
          rm -f "$target"/*.jar
          cp "${{ steps.jar.outputs.path }}" "$target"/
          echo "kept=$target/$(basename "${{ steps.jar.outputs.path }}")" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always() && steps.version.outputs.version != ''
        env:
          JAR: ${{ steps.jar.outputs.path }}
          KEPT: ${{ steps.keep.outputs.kept }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          count() {
            find . -path '*/build/test-results/*' -name 'TEST-*.xml' -exec grep -ho "$1=\"[0-9]*\"" {} + 2>/dev/null \
              | tr -dc '0-9\n' | awk '{ s += $1 } END { print s + 0 }'
          }
          tests=$(count tests); failed=$(( $(count failures) + $(count errors) )); skipped=$(count skipped)
          {
            echo "### ${{ github.event.repository.name }} \`$VERSION\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Java | ${{ inputs.java-version }} |"
            echo "| Tests | $((tests - failed - skipped)) passed, $failed failed, $skipped skipped |"
            if [ -n "$JAR" ] && [ -f "$JAR" ]; then
              echo "| Jar | \`$(basename "$JAR")\` ($(du -h "$JAR" | cut -f1)) |"
              echo "| sha256 | \`$(sha256sum "$JAR" | cut -c1-16)…\` |"
            fi
            if [ -n "$KEPT" ]; then echo "| On the runner | \`$KEPT\` |"; fi
          } >> "$GITHUB_STEP_SUMMARY"
