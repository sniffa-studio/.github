name: trivy

on:
  workflow_call:
    inputs:
      path:
        description: Directory to scan, relative to the checkout
        type: string
        default: .
      mode:
        description: fs for lockfiles in a source tree, rootfs for built output such as jars
        type: string
        default: fs

jobs:
  scan:
    runs-on: [self-hosted, sniffa]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fail on fixable critical vulnerabilities
        env:
          SCAN_PATH: ${{ inputs.path }}
          SCAN_MODE: ${{ inputs.mode }}
        run: |
          ignore=()
          [ -f .trivyignore ] && ignore=(--ignorefile /src/.trivyignore)
          docker run --rm -v trivy-cache:/root/.cache -v "$PWD":/src:ro aquasec/trivy:0.74.0 \
            "$SCAN_MODE" --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format table "${ignore[@]}" "/src/$SCAN_PATH" | tee trivy.txt
          {
            echo "### Trivy ($SCAN_MODE $SCAN_PATH)"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker run --rm -v trivy-cache:/root/.cache -v "$PWD":/src:ro aquasec/trivy:0.74.0 \
            "$SCAN_MODE" --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --format table "${ignore[@]}" "/src/$SCAN_PATH" > /dev/null
